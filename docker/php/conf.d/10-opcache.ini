; OPcache for the PHP image, in production and development alike.
; Keeps PHP-FPM from reparsing the framework and compiled bundle on every
; request. Timestamps are still checked on every request, so code changed in
; the mounted checkout (a git pull, a new module) is picked up without a
; restart.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.enable_file_override=0
opcache.jit=0
