# AstrX: the site, its database and the Rust engines, with one command.
#
#   cp .env.example .env      # set the database secrets first
#   docker compose up -d
#
# The engines come from the astrx-suite repository, cloned next to this one
# (../astrx-suite); its compose file is included below, so the services are
# defined in one place only. To run the engines without the site, use that
# repository on its own.
#
# The suite's `internal` network has no route to the host or the internet,
# and the engines publish no ports. `phpfpm` joins that network and reaches
# each engine by name:
#
#     gitweb:8801  onioncrawler-search:8802  websearch-serve:8803
#     torrentds-search:8804  suitedash:8806
#
# Use those names in the bridge configs (resources/config/GitBrowse,
# SuiteDash, WebSearch, OnionSearch and TorrentSearch .config.php) instead of
# 127.0.0.1:88xx, which is only right when the engines run on the host. See
# docs/suite-search-modules.md.

name: astrx

# The engine services, included rather than copied (https://github.com/Vxmdzhb/astrx-suite,
# cloned at ../astrx-suite). Needs Docker Compose 2.20 or newer; with an older
# one, run the two stacks separately.
include:
  - path: ../astrx-suite/docker-compose.yml

services:
  # ------------------------------------------------------------------ nginx --
  nginx:
    tty: true
    restart: unless-stopped
    container_name: astrx.nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      # Loopback only, so the site is reachable by the host's tor daemon or a
      # local reverse proxy but NOT published on the host's clearnet
      # interfaces — a plain "80:80" listens on 0.0.0.0.
      - "127.0.0.1:80:80"
    volumes:
      - ./public:/app/public:ro
      - ./src:/app/src:ro
      - ./vendor:/app/vendor:ro
      - ./resources:/app/resources:ro
      - ./build:/app/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [php-network]
    depends_on: [phpfpm]

  # ----------------------------------------------------------------- php-fpm --
  phpfpm:
    tty: true
    restart: unless-stopped
    container_name: astrx.phpfpm
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    volumes:
      - ./public:/app/public:ro
      - ./src:/app/src:ro
      - ./vendor:/app/vendor:ro
      - ./resources:/app/resources:ro
      - ./build:/app/build:ro
      # tools/ holds the CLI entry points (e.g. the search crawler). Without
      # this mount /app/tools does not exist in the container, so both
      # `php /app/tools/search_index.php` AND the admin "Rebuild now" button
      # (which exec()s that same path) fail — the job then wedges in 'running'.
      - ./tools:/app/tools:ro
      - ./resources:/app/resource-seed:ro
      - app-config:/app/resources/config
      - template-cache:/app/resources/template/cache
      - avatars:/app/resources/avatar
      - catalogs:/app/resources/lang
      - board-uploads:/app/resources/board_uploads
      - chat-uploads:/app/resources/chat_uploads
      - media-uploads:/app/resources/media_uploads
    networks:
      - php-network
      # The suite's no-egress network, so the CMS bridge pages can reach the
      # engines by service name without any engine publishing a port.
      - internal

  # ---------------------------------------------------------------- mariadb --
  mariadb:
    tty: true
    restart: unless-stopped
    container_name: astrx.mariadb
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    # The database stays on the internal compose network; do NOT publish it to
    # the host — needless attack surface on a hidden-service box. Uncomment only
    # for local debugging, never in production.
    # ports:
    #   - '3306:3306'
    volumes:
      - ./src/setup/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mariadb-data:/var/lib/mysql
    networks: [php-network]
    environment:
      # No default secret: set it in .env. Compose refuses to start without it.
      MARIADB_ROOT_PASSWORD_HASH: "${MARIADB_ROOT_PASSWORD_HASH:?set MARIADB_ROOT_PASSWORD_HASH in .env}"
      # The application account is provisioned through the official MariaDB
      # entrypoint rather than a hardcoded CREATE USER / GRANT ALL in init.sql,
      # so it is granted rights on THAT database only — no wildcard ALL
      # PRIVILEGES on *.*. NB: the running app reads its own
      # resources/config/PDO.config.php; keep its db_name/db_username/db_password
      # in sync with these values.
      MARIADB_DATABASE: "${DB_NAME:-content_manager}"
      MARIADB_USER: "${DB_USER:?set DB_USER in .env}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?set a strong DB_PASSWORD in .env}"

networks:
  php-network:
    driver: bridge
  # `internal` itself is defined by the included suite compose (internal: true,
  # pinned subnet); naming it here only joins it.

volumes:
  # The database gets a named volume, like every other service that keeps
  # state.
  mariadb-data:
  app-config:
  template-cache:
  avatars:
  catalogs:
  board-uploads:
  chat-uploads:
  media-uploads:
