# A throwaway IMAP server for the webmail screenshots. Plain-text logins on
# 127.0.0.1 only: never use this configuration for real mail.
#
#   mkdir -p demo-data/mail
#   sed "s#@MAIL_ROOT@#$PWD/demo-data/mail#g" tools/demo/mail/dovecot.conf > demo-data/mail/dovecot.conf
#   cp tools/demo/mail/users demo-data/mail/users
#   mkdir -p demo-data/mail/boxes && chown vmail:vmail demo-data/mail/boxes   # dovecot's mail user
#   dovecot -c demo-data/mail/dovecot.conf
#
# The site then needs IMAP_HOST=127.0.0.1 IMAP_PORT=1143 IMAP_ENCRYPTION=none
# MAIL_DOMAIN=example.onion MAIL_LOCAL=true in its environment.
protocols = imap
listen = 127.0.0.1
base_dir = @MAIL_ROOT@/run
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:@MAIL_ROOT@/boxes/%n
first_valid_uid = 100
default_internal_user = dovecot
default_login_user = dovenull
log_path = @MAIL_ROOT@/dovecot.log
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u @MAIL_ROOT@/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=@MAIL_ROOT@/boxes/%n
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    auto = subscribe
  }
}
